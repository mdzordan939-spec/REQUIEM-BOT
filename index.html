
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#080808">
    <title>REQUIEM</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div class="ambient" aria-hidden="true">
    <div class="ambient-glow"></div>
    <span class="slash slash-a"></span>
    <span class="slash slash-b"></span>
    <span class="slash slash-c"></span>
    <span class="slash slash-d"></span>
    <span class="slash slash-e"></span>
    <span class="square square-a"></span>
    <span class="square square-b"></span>
    <span class="square square-c"></span>
    <span class="square square-d"></span>
    <span class="square square-e"></span>
    <span class="square square-f"></span>
</div>

<main class="app">

    <header class="header">
        <div class="brand">
            <span class="brand-mark">R</span>
            <div class="brand-text">REQUIEM <b>BOT</b></div>
        </div>
        <button class="icon-btn" id="settings" aria-label="Настройки">⚙</button>
    </header>

    <section class="hero">
        <div class="hero-label">
            <span class="status-dot"></span>
            PLAYER SPACE
        </div>
        <h1>ТВОЯ<br><span>ИСТОРИЯ.</span></h1>
        <p>Каждый день — новый уровень.</p>
        <div class="hero-line"></div>
    </section>

    <section class="profile panel">
        <div class="profile-top">
            <div class="avatar">R</div>
            <div class="profile-info">
                <h2 id="username">Игрок</h2>
                <p>Уровень <span id="level">1</span></p>
            </div>
            <span class="profile-tag">PLAYER</span>
        </div>
        <div class="xp-info">
            <span>ОПЫТ</span>
            <small><span id="xp">0</span> / 100 XP</small>
        </div>
        <div class="xp-line">
            <span class="xp-fill" id="xpFill"></span>
        </div>
    </section>

    <section class="section-heading">
        <div>
            <small>ТВОИ РЕСУРСЫ</small>
            <h2>Статистика</h2>
        </div>
        <span class="section-number">01</span>
    </section>

    <section class="stats">
        <button class="stat panel" data-page="crystals">
            <span class="red-icon">◇</span>
            <div>
                <small>КРИСТАЛЛЫ</small>
                <strong id="crystals">0</strong>
            </div>
            <span class="chevron">↗</span>
        </button>

        <button class="stat panel" data-page="bonus">
            <span class="red-icon">✦</span>
            <div>
                <small>НАГРАДА</small>
                <strong class="stat-label">Бонус</strong>
            </div>
            <span class="chevron">↗</span>
        </button>
    </section>

    <section class="section-heading">
        <div>
            <small>ВЫБИРАЙ СВОЙ ПУТЬ</small>
            <h2>Разделы</h2>
        </div>
        <span class="section-number">02</span>
    </section>

    <section class="menu">
        <button class="menu-item panel" data-page="collection">
            <span class="menu-icon">▦</span>
            <span class="menu-content">
                <strong>Коллекция</strong>
                <small>Твои предметы и достижения</small>
            </span>
            <span class="chevron">↗</span>
        </button>

        <button class="menu-item panel" data-page="games">
            <span class="menu-icon">♧</span>
            <span class="menu-content">
                <strong>Игры</strong>
                <small>Испытай свои способности</small>
            </span>
            <span class="chevron">↗</span>
        </button>

        <button class="menu-item panel" data-page="rating">
            <span class="menu-icon">♜</span>
            <span class="menu-content">
                <strong>Рейтинг</strong>
                <small>Сравни результаты игроков</small>
            </span>
            <span class="chevron">↗</span>
        </button>

        <button class="menu-item panel" data-page="tasks">
            <span class="menu-icon">☑</span>
            <span class="menu-content">
                <strong>Задания</strong>
                <small>Выполняй и получай награды</small>
            </span>
            <span class="chevron">↗</span>
        </button>

        <button class="menu-item panel" data-page="profile">
            <span class="menu-icon">♟</span>
            <span class="menu-content">
                <strong>Профиль</strong>
                <small>Твоя статистика и настройки</small>
            </span>
            <span class="chevron">↗</span>
        </button>
    </section>

    <!-- GAMES HUB -->

    <section id="gamesHub" style="display:none">

        <div class="section-heading">
            <div>
                <small>ВЫБИРАЙ РЕЖИМ</small>
                <h2>Игровая арена</h2>
            </div>
            <span class="section-number">03</span>
        </div>

        <button class="menu-item panel" id="openChess">
            <span class="menu-icon">♟</span>
            <span class="menu-content">
                <strong>Шахматы</strong>
                <small>Онлайн-партии · ELO · Комнаты</small>
            </span>
            <span class="chevron">↗</span>
        </button>

        <div class="panel" style="
            margin-top:12px;
            padding:20px;
            border-radius:14px;
            opacity:.65;
        ">
            <div style="font-size:28px;color:#e20b25">＋</div>
            <strong>Новые игры</strong>
            <p style="font-size:12px;color:#888">
                Другие игровые режимы появятся здесь.
            </p>
        </div>

    </section>

    <!-- CHESS SCREEN MOUNT -->

    <section id="chessScreen" style="display:none">
        <button class="menu-item panel" id="backToGames"
            style="margin-bottom:14px">
            <span class="menu-icon">←</span>
            <span class="menu-content">
                <strong>Назад к играм</strong>
                <small>Вернуться в игровую арену</small>
            </span>
        </button>

        <div id="chessMount"></div>
    </section>

    <section class="rating-section" id="ratingSection" style="display:none">
        <h2>🏆 Рейтинг игроков</h2>
        <div id="ratingList"></div>
    </section>

    <nav class="bottom-nav panel" aria-label="Навигация">
        <button class="nav-item active" data-page="home">
            <span>⌂</span>
            <small>Главная</small>
        </button>
        <button class="nav-item" data-page="collection">
            <span>▣</span>
            <small>Коллекция</small>
        </button>
        <button class="nav-item" data-page="games">
            <span>♧</span>
            <small>Игры</small>
        </button>
        <button class="nav-item" data-page="rating">
            <span>♜</span>
            <small>Рейтинг</small>
        </button>
        <button class="nav-item" data-page="profile">
            <span>♟</span>
            <small>Профиль</small>
        </button>
    </nav>

</main>

<div class="toast" id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
